
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover the story, vision and values behind Simple J — technology, elevated.">
  <title>About Us | Simple J</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .about-hero {
      min-height: 590px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 100px 8%;
      background:
        linear-gradient(90deg, rgba(5,5,5,.96), rgba(5,5,5,.65), rgba(5,5,5,.2)),
        url("https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=2000&q=90") center/cover;
    }

    .about-hero-content {
      max-width: 750px;
      position: relative;
      z-index: 2;
      animation: aboutRise 1s ease both;
    }

    .about-eyebrow {
      color: #d6b56d;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .about-hero h1 {
      color: #fff;
      font-family: "Playfair Display", serif;
      font-size: clamp(48px, 7vw, 88px);
      line-height: 1.05;
      font-weight: 500;
      margin: 0 0 25px;
    }

    .about-hero h1 span {
      color: #d6b56d;
      font-style: italic;
    }

   .about-hero p {
  color: #d0d0d0;
  max-width: 540px;
  font-size: 16px;
  line-height: 1.9;
}
